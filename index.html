<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lopper: prune unused code through a pull request</title>
  <meta name="description" content="Lopper finds unused packages, exports and dev dependencies in frontend and backend repos, shows the evidence, and removes what you tick through a pull request you review.">
  <link rel="icon" type="image/svg+xml" href="/assets/logo/lopper-app-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400..700&family=Red+Hat+Text:wght@400..600&family=Red+Hat+Mono:wght@400&display=swap">
  <script>
    // Pick the theme before the first paint, so a dark page never flashes light. Keep this in step with src/theme.ts
    // (a test runs this script against it): a saved "light" or "dark" wins, and otherwise the device decides.
    (function () {
      var saved = null;
      try { saved = window.localStorage.getItem("lopper-theme"); } catch (e) {}
      var dark = false;
      try { dark = window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {}
      document.documentElement.setAttribute("data-theme", saved === "light" || saved === "dark" ? saved : dark ? "dark" : "light");
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
